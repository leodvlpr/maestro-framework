# Verify an article is listed under Saved > All articles.
# Inputs:
#   ARTICLE_TITLE        article title as listed (regex)
#   ARTICLE_DESCRIPTION  article short description (regex)
appId: ${APP_ID}
---
- tapOn:
    id: tabbar-save
- runFlow:
    file: ../app/dismiss_tips.yaml
    label: Dismiss Saved-tab prompts
- assertVisible: "All articles"
- assertVisible: ${ARTICLE_TITLE}
- assertVisible: ${ARTICLE_DESCRIPTION}

# Search for an article and open it from the results list.
# Precondition: a screen showing the "Search Wikipedia" field (home or article).
# Inputs:
#   SEARCH_QUERY         text typed into the search field
#   ARTICLE_DESCRIPTION  result's short description (regex); used to pick the result,
#                        because the filled search field also matches the title text
# Postcondition: article loaded, tips dismissed, save toggle visible.
appId: ${APP_ID}
---
- tapOn: "Search Wikipedia"
- inputText: ${SEARCH_QUERY}
# The "Add languages" tip appears with the first results after a clean install.
- extendedWaitUntil:
    visible:
      id: PopoverDismissRegion
    timeout: 10000
    optional: true
    label: Wait for first-search tip (only after a clean install)
- runFlow:
    file: ../app/dismiss_tips.yaml
    label: Dismiss search tips
- extendedWaitUntil:
    visible: ${ARTICLE_DESCRIPTION}
    timeout: 15000
- tapOn: ${ARTICLE_DESCRIPTION}
# Article tips ("Tap to go back", "Open in new tab") appear once content renders.
- extendedWaitUntil:
    visible: "Got it"
    timeout: 20000
    optional: true
    label: Wait for first-article tips (only after a clean install)
- runFlow:
    file: ../app/dismiss_tips.yaml
    label: Dismiss article tips
- extendedWaitUntil:
    visible: ${ARTICLE_DESCRIPTION}
    timeout: 20000
    label: Wait for article content

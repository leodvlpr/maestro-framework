# Dismiss any first-run tip or prompt currently on screen; does nothing if none is shown.
# Tips hide the content behind them from the accessibility tree, so call this
# before asserting on a screen where a tip can appear (sut-contract.md "Interruptions").
# Inputs: none.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible:
        id: PopoverDismissRegion
    commands:
      - tapOn:
          id: PopoverDismissRegion
    label: Dismiss popover tip (e.g. "Add languages") if visible
- repeat:
    times: 3
    while:
      visible: "Got it"
    commands:
      - tapOn: "Got it"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: reading-list-login
    commands:
      - tapOn: "Close"
    label: Dismiss reading-list login prompt if visible

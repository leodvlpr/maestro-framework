# Maestro workspace configuration.
# Only tests/ contains executable tests. pages/, components/, common/ and data/
# are building blocks invoked from tests and are never discovered.
# No appId here: every test declares `appId: ${MAESTRO_APP_ID}`.
flows:
  - "tests/**"

# Default output location. Maestro resolves this against the current working
# directory (not .maestro/), so run commands from the repository root.
# scripts/run_tests.sh overrides it per run with artifacts/maestro/<run-id>.
testOutputDir: artifacts/maestro/default
